name: Poll jobs

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours
  workflow_dispatch:
  push:
    branches: [master, main]
    paths: [web/**, config.yaml, jobhunter/**]

permissions: {}   # each job asks for only what it needs

concurrency:
  group: poll-jobs
  cancel-in-progress: false

jobs:
  poll:
    # Handles scraped (untrusted) data and the API secrets, so it gets no Pages / OIDC permissions.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # commit data/jobs.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Poll, evaluate, build encrypted site
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: python -m jobhunter.main
      - name: Refuse to publish unencrypted data
        run: |
          test -f _site/jobs.enc.json
          if [ -e _site/jobs.json ]; then echo "plaintext jobs.json in site build" >&2; exit 1; fi
      - name: Commit job data
        run: |
          git config user.name "job-hunter-bot"
          git config user.email "job-hunter-bot@users.noreply.github.com"
          git add data/jobs.json data/site_salt.txt
          git diff --cached --quiet || git commit -m "Update job postings [skip ci]"
          git pull --rebase && git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: poll
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deploy
        uses: actions/deploy-pages@v4
