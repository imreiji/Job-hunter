name: Poll jobs

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours
  workflow_dispatch:
  push:
    branches: [master, main]
    paths: [web/**, config.yaml, jobhunter/**]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: poll-jobs
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Poll, evaluate, build site
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: python -m jobhunter.main
      - name: Commit job data
        run: |
          git config user.name "job-hunter-bot"
          git config user.email "job-hunter-bot@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet || git commit -m "Update job postings [skip ci]"
          git pull --rebase && git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
