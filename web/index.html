<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canadian Aviation Jobs</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5d6673; --border: #dfe3e8;
    --accent: #1f5fbf; --on-score: #ffffff;
    --strong: #1a7f37; --possible: #9a6700; --weak: #8c4a1f; --ineligible: #b42318; --pending: #6e7781;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #171b21; --text: #e6e9ed; --muted: #9aa4b1; --border: #2a3039;
      --accent: #6ea8ff; --on-score: #0f1216;
      --strong: #4ac26b; --possible: #d4a72c; --weak: #e0823d; --ineligible: #f47067; --pending: #8b949e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header, main { max-width: 1000px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 28px; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px;
          cursor: pointer; user-select: none; }
  .stat b { font-size: 1.2rem; display: block; }
  .stat.on { outline: 2px solid var(--accent); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .controls input[type=search], .controls select {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--panel); color: var(--text); font: inherit; min-width: 0; }
  .controls input[type=search] { flex: 1 1 220px; }
  .controls select { max-width: 240px; }
  .controls label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .job { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
         padding: 14px 16px; margin-bottom: 10px; }
  .job.closed { opacity: .55; }
  .top { display: flex; gap: 12px; align-items: flex-start; }
  .score { flex: 0 0 52px; height: 52px; border-radius: 8px; display: grid; place-items: center;
           font-weight: 700; font-size: 1.15rem; color: var(--on-score); background: var(--pending); }
  .info { flex: 1; min-width: 0; }
  .title { font-weight: 600; font-size: 1.05rem; color: var(--text); text-decoration: none; }
  .title:hover { text-decoration: underline; }
  .meta { color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
  .meta a { color: var(--accent); }
  .badge { display: inline-block; font-size: .75rem; font-weight: 600; padding: 1px 8px; border-radius: 99px;
           border: 1px solid currentColor; margin-left: 6px; text-transform: uppercase; letter-spacing: .03em; }
  .summary { margin: 8px 0 0; }
  details { margin-top: 8px; }
  summary { cursor: pointer; color: var(--accent); font-size: .9rem; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 8px; }
  .cols h4 { margin: 0 0 4px; font-size: .85rem; text-transform: uppercase; color: var(--muted); }
  .cols ul { margin: 0; padding-left: 18px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 24px 16px; }
</style>
</head>
<body>
<header>
  <h1>Canadian Aviation Jobs</h1>
  <p class="sub" id="updated">Loading…</p>
  <div class="stats" id="stats"></div>
  <div class="controls">
    <input type="search" id="q" placeholder="Search title, company, location…">
    <select id="company"><option value="">All companies</option></select>
    <select id="sort">
      <option value="score">Best match first</option>
      <option value="new">Newest first</option>
    </select>
    <label><input type="checkbox" id="closed"> Show closed</label>
  </div>
</header>
<main id="list"></main>
<footer>Matches are generated by DeepSeek from your profile. Always read the full posting.</footer>

<script>
const VERDICTS = ["strong", "possible", "weak", "ineligible", "pending"];
const $ = id => document.getElementById(id);
const state = { jobs: [], verdict: "" };

const verdictOf = j => j.evaluation ? j.evaluation.verdict : "pending";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const SOURCE_NAMES = { jobbank: "Job Bank", linkedin: "LinkedIn", eluta: "Eluta", greenhouse: "company site",
  lever: "company site", ashby: "company site", workday: "company site", usajobs: "USAJOBS" };
const sourceName = s => SOURCE_NAMES[s] || "company site";
const sourcesLine = j => {
  const links = (j.also_listed || []).map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(sourceName(l.source))}</a>`);
  return `via ${esc(sourceName(j.id.split(":")[0]))}${links.length ? ` · also on ${links.join(", ")}` : ""}`;
};
const fmtDate = s => s ? new Date(s).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "";
const list = (title, items) => items && items.length
  ? `<div><h4>${title}</h4><ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>` : "";

function render() {
  const q = $("q").value.trim().toLowerCase();
  const company = $("company").value;
  const showClosed = $("closed").checked;
  const visible = state.jobs.filter(j => showClosed || j.active);

  const counts = Object.fromEntries(VERDICTS.map(v => [v, 0]));
  visible.forEach(j => counts[verdictOf(j)]++);
  $("stats").innerHTML = [["", "All", visible.length], ...VERDICTS.map(v => [v, v, counts[v]])]
    .map(([v, label, n]) => `<div class="stat ${state.verdict === v ? "on" : ""}" data-v="${v}"
       style="${v ? `color:var(--${v})` : ""}"><b>${n}</b>${label}</div>`).join("");

  let jobs = visible.filter(j =>
    (!state.verdict || verdictOf(j) === state.verdict) &&
    (!company || j.company === company) &&
    (!q || `${j.title} ${j.company} ${j.location}`.toLowerCase().includes(q)));

  jobs.sort($("sort").value === "score"
    ? (a, b) => (b.evaluation?.score ?? -1) - (a.evaluation?.score ?? -1) || b.first_seen.localeCompare(a.first_seen)
    : (a, b) => b.first_seen.localeCompare(a.first_seen));

  $("list").innerHTML = jobs.length ? jobs.map(j => {
    const ev = j.evaluation, v = verdictOf(j);
    return `<article class="job ${j.active ? "" : "closed"}">
      <div class="top">
        <div class="score" style="background:var(--${v})">${ev ? ev.score : "–"}</div>
        <div class="info">
          <a class="title" href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a>
          <span class="badge" style="color:var(--${v})">${v}</span>
          ${j.active ? "" : `<span class="badge" style="color:var(--muted)">closed ${fmtDate(j.closed_at)}</span>`}
          <div class="meta">${esc(j.company)} · ${esc(j.location || "Location n/a")} · found ${fmtDate(j.first_seen)} · ${sourcesLine(j)}</div>
        </div>
      </div>
      ${ev ? `<p class="summary">${esc(ev.summary)}</p>
        <details><summary>Requirement breakdown</summary><div class="cols">
          ${list("Dealbreakers", ev.dealbreakers)}${list("Missing", ev.missing)}${list("You meet", ev.met)}
        </div></details>` : ""}
    </article>`;
  }).join("") : `<div class="empty">No postings match these filters.</div>`;
}

fetch("jobs.json", { cache: "no-store" })
  .then(r => r.json())
  .then(data => {
    state.jobs = data.jobs;
    $("updated").textContent = `Last polled ${data.updated ? new Date(data.updated).toLocaleString() : "never"} · ${data.jobs.length} postings tracked`;
    [...new Set(data.jobs.map(j => j.company))].sort()
      .forEach(c => $("company").insertAdjacentHTML("beforeend", `<option>${esc(c)}</option>`));
    render();
  })
  .catch(e => { $("updated").textContent = `Could not load jobs.json: ${e}`; });

$("stats").addEventListener("click", e => {
  const el = e.target.closest(".stat");
  if (el) { state.verdict = el.dataset.v; render(); }
});
["q", "company", "sort", "closed"].forEach(id => $(id).addEventListener("input", render));
</script>
</body>
</html>
